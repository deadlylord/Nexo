name: APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" "platforms;android-36.1" "build-tools;36.1.0" > /dev/null 2>&1 || \
          yes | "$SDKMANAGER" "platforms;android-36" > /dev/null 2>&1

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Nexo-debug.apk
          ls -lh dist

      - name: Upload artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: Nexo-debug-apk
          path: dist/Nexo-debug.apk
          retention-days: 1

      - name: Publish release APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Nexo (última compilación)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: dist/Nexo-debug.apk
          body: |
            APK compilada automáticamente desde `${{ github.sha }}`.

            Instalable directamente en el teléfono. Firma de depuración compartida,
            la misma que usan las compilaciones locales.
